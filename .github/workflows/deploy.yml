name: Deploy a producción (GitHub Pages)

# Cada push a main o a una rama claude/** publica el sitio en GitHub Pages.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Si el proyecto tiene un build de Node (package.json con script "build"),
      # se compila y se publica dist/. Si no, se publica site/ tal cual.
      - name: Detectar tipo de proyecto
        id: detect
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            echo "node=true" >> "$GITHUB_OUTPUT"
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "dir=site" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.detect.outputs.node == 'true'
        env:
          # Variables del repositorio (Settings > Secrets and variables > Actions > Variables)
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
